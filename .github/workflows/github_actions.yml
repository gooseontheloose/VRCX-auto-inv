name: PAW Inviter - VRCX

on:
    workflow_dispatch:
    push:
        tags:
            - 'v*'

concurrency:
    group: ${{ github.ref }}
    cancel-in-progress: true

permissions:
    id-token: write
    contents: write

jobs:
    set_version:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            - uses: actions/checkout@v6
            - id: version
              run: |
                  # Use the git tag when triggered by a tag push, otherwise read the Version file
                  if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
                      VERSION="${GITHUB_REF_NAME#v}"
                  else
                      VERSION="$(cat Version)"
                  fi
                  echo "version=${VERSION}" >> $GITHUB_OUTPUT
                  echo "Building version: ${VERSION}"

    build_frontend:
        runs-on: ubuntu-latest
        needs: set_version
        steps:
            - uses: actions/checkout@v6
            - name: Set version
              run: echo "${{ needs.set_version.outputs.version }}" > Version
            - uses: actions/setup-node@v6
              with:
                  node-version: lts/*
            - name: Get npm cache directory
              id: npm-cache-dir
              run: echo "dir=$(npm config get cache)" >> $GITHUB_OUTPUT
            - uses: actions/cache@v5
              with:
                  path: ${{ steps.npm-cache-dir.outputs.dir }}
                  key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: ${{ runner.os }}-node-
            - run: npm ci
            - name: Build frontend
              run: npm run prod
            - uses: actions/upload-artifact@v7
              with:
                  name: cef-html
                  path: build/html

    build_windows:
        runs-on: windows-latest
        defaults:
            run:
                shell: bash
        needs: [set_version, build_frontend]
        steps:
            - uses: actions/checkout@v6
            - name: Set version
              run: |
                  echo "${{ needs.set_version.outputs.version }}" > Version
                  echo "!define PRODUCT_VERSION_FROM_FILE \"${{ needs.set_version.outputs.version }}.0\"" > Installer/version_define.nsh
            - uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: '10.0.x'
            - uses: actions/cache@v5
              with:
                  path: ~/.nuget/packages
                  key: ${{ runner.os }}-nuget-${{ hashFiles('**/Dotnet/VRCX-Cef.csproj') }}
                  restore-keys: ${{ runner.os }}-nuget-
            - name: Build .NET application
              run: dotnet build Dotnet/VRCX-Cef.csproj -p:Configuration=Release -p:WarningLevel=0 -p:Platform=x64 -p:PlatformTarget=x64 -p:RestorePackagesConfig=true -t:"Restore;Clean;Build" -m -a x64 --self-contained
            - name: Download frontend
              uses: actions/download-artifact@v8
              with:
                  name: cef-html
                  path: build/Cef/html
            - name: Install NSIS
              run: choco install nsis -y
            - name: Build NSIS installer
              uses: joncloud/makensis-action@v5.0
              with:
                  script-file: Installer/installer.nsi
                  additional-plugin-paths: Installer/Plugins
            - name: Rename installer
              run: mv Installer/PAWInviter_Setup.exe PAWInviter_${{ needs.set_version.outputs.version }}_Setup.exe
            - name: Upload installer artifact
              uses: actions/upload-artifact@v7
              with:
                  name: installer
                  path: PAWInviter_${{ needs.set_version.outputs.version }}_Setup.exe
            - name: Upload build artifact
              uses: actions/upload-artifact@v7
              with:
                  name: cef-build
                  path: build/Cef

    package:
        runs-on: ubuntu-latest
        needs: [set_version, build_windows]
        steps:
            - name: Download build
              uses: actions/download-artifact@v8
              with:
                  name: cef-build
                  path: build/Cef
            - name: Download frontend
              uses: actions/download-artifact@v8
              with:
                  name: cef-html
                  path: build/Cef/html
            - name: Make portable zip
              run: |
                  cd build/Cef
                  7z a -tzip ../../PAWInviter_${{ needs.set_version.outputs.version }}.zip * -mx=7 -xr0!*.log
            - uses: actions/upload-artifact@v7
              with:
                  name: portable-zip
                  path: PAWInviter_${{ needs.set_version.outputs.version }}.zip

    release:
        runs-on: ubuntu-latest
        if: startsWith(github.ref, 'refs/tags/v')
        needs: [set_version, build_windows, package]
        steps:
            - name: Download installer
              uses: actions/download-artifact@v8
              with:
                  name: installer
            - name: Download portable zip
              uses: actions/download-artifact@v8
              with:
                  name: portable-zip
            - name: Publish GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ github.ref_name }}
                  name: PAW Inviter - VRCX ${{ needs.set_version.outputs.version }}
                  draft: false
                  prerelease: false
                  body: |
                      ## PAW Inviter - VRCX ${{ needs.set_version.outputs.version }}

                      ### Install
                      Download and run **`PAWInviter_${{ needs.set_version.outputs.version }}_Setup.exe`**

                      Handles VC++ Redistributable, registry, and Start Menu shortcuts automatically.
                      Upgrading from a previous version? The installer replaces it silently and relaunches.

                      ### Portable
                      Extract **`PAWInviter_${{ needs.set_version.outputs.version }}.zip`** anywhere and run `VRCX.exe`.
                  files: |
                      PAWInviter_${{ needs.set_version.outputs.version }}_Setup.exe
                      PAWInviter_${{ needs.set_version.outputs.version }}.zip
